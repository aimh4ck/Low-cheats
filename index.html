<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOW CHEATS • Gerador de Keys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
body{min-height:100vh;background:#080609;color:#fff;display:flex;justify-content:center;padding:24px}
.wrap{width:100%;max-width:430px;margin:auto}
.brand{text-align:center;margin-bottom:22px}
.brand h1{font-size:30px;font-weight:900;color:#ff5fa8}
.brand p{font-size:11px;letter-spacing:2px;color:#777;margin-top:6px}
.card{background:#19121e;border:1px solid #35263e;border-radius:28px;padding:22px;box-shadow:0 20px 60px #000}
h2{font-size:18px;margin-bottom:18px}
label{display:block;font-size:10px;letter-spacing:1.5px;color:#9d8da7;font-weight:800;margin:15px 0 8px}
select,input{width:100%;background:#0f0d11;color:#fff;border:1px solid #34283b;border-radius:15px;padding:14px;outline:none}
button{border:0;border-radius:15px;padding:14px;font-weight:900;cursor:pointer}
.primary{width:100%;margin-top:16px;background:#ff69b0;color:#fff}
.generated{margin-top:16px;padding:16px;border:1px dashed #ff69b0;border-radius:15px;text-align:center;color:#ff78b8;font-weight:900;word-break:break-all;background:#100d12}
.actions{display:flex;gap:9px;margin-top:10px}
.actions button{flex:1;background:#2b2037;color:#fff;border:1px solid #44334f}
.actions .copy{background:#ff69b0;border:0}
.stats{display:flex;gap:8px;margin:18px 0}
.stat{flex:1;background:#21182a;border-radius:14px;padding:11px;text-align:center}
.stat b{display:block;font-size:18px;color:#ff78b8}
.stat span{font-size:9px;color:#8f8198}
.list{max-height:300px;overflow:auto;margin-top:12px}
.row{background:#21182a;border:1px solid #35263e;border-radius:14px;padding:12px;margin-bottom:8px}
.row .key{font-size:11px;color:#ff78b8;font-weight:900;word-break:break-all}
.row .meta{font-size:10px;color:#a99bad;margin-top:5px}
.row button{float:right;margin-top:-24px;padding:6px 9px;background:transparent;color:#ff78b8;font-size:9px}
.empty{text-align:center;color:#75697c;font-size:11px;padding:18px}
.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,100px);opacity:0;background:#21182a;border:1px solid #ff69b0;padding:13px 20px;border-radius:20px;font-size:12px;font-weight:800;transition:.3s}
.toast.show{transform:translate(-50%,0);opacity:1}
.note{font-size:9px;color:#716675;text-align:center;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>LOW CHEATS</h1>
    <p>PAINEL EXTERNO • GERADOR DE KEYS</p>
  </div>

  <div class="card">
    <h2>🔑 Gerador de Keys</h2>

    <label>VALIDADE DA KEY</label>
    <select id="validade">
      <option value="1">1 dia</option>
      <option value="7">7 dias</option>
      <option value="30">30 dias</option>
      <option value="90">90 dias</option>
      <option value="0">Ilimitada</option>
    </select>

    <button class="primary" onclick="gerar()">GERAR NOVA KEY</button>

    <div class="generated" id="gerada">Nenhuma key gerada</div>

    <div class="actions">
      <button class="copy" onclick="copiar()">COPIAR KEY</button>
      <button onclick="apagarTudo()">LIMPAR TUDO</button>
    </div>

    <div class="stats">
      <div class="stat"><b id="total">0</b><span>TOTAL</span></div>
      <div class="stat"><b id="ativas">0</b><span>ATIVAS</span></div>
      <div class="stat"><b id="revogadas">0</b><span>REVOGADAS</span></div>
    </div>

    <h2 style="font-size:13px;margin-top:5px">Keys geradas</h2>
    <div class="list" id="lista"></div>
  </div>

  <p class="note">Este site é separado da sua Proxy. As keys desta versão ficam salvas no navegador usado para administrar o painel.</p>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE="lowcheats_external_keys";

function keys(){
  try{return JSON.parse(localStorage.getItem(STORAGE)||"[]")}catch(e){return[]}
}
function save(v){localStorage.setItem(STORAGE,JSON.stringify(v))}
function randKey(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s="";
  if(window.crypto?.getRandomValues){
    const a=new Uint32Array(16); crypto.getRandomValues(a);
    for(let i=0;i<16;i++)s+=chars[a[i]%chars.length];
  }else{
    for(let i=0;i<16;i++)s+=chars[Math.floor(Math.random()*chars.length)];
  }
  return "LOW-"+s.slice(0,4)+"-"+s.slice(4,8)+"-"+s.slice(8,12)+"-"+s.slice(12);
}
function gerar(){
  const dias=Number(document.getElementById("validade").value);
  const agora=Date.now();
  const arr=keys();
  const key=randKey();
  arr.unshift({key,criada:agora,expira:dias?agora+dias*86400000:0,revogada:false});
  save(arr);
  document.getElementById("gerada").textContent=key;
  render();
  toast("Key gerada!");
}
function copiar(){
  const k=document.getElementById("gerada").textContent;
  if(!k.startsWith("LOW-"))return toast("Gere uma key primeiro");
  navigator.clipboard?.writeText(k).then(()=>toast("Key copiada!"),()=>toast("Copie manualmente"));
}
function revogar(i){
  const arr=keys(); arr[i].revogada=true; save(arr); render(); toast("Key revogada");
}
function apagarTudo(){
  if(confirm("Apagar todas as keys deste painel?")){
    localStorage.removeItem(STORAGE);
    document.getElementById("gerada").textContent="Nenhuma key gerada";
    render(); toast("Keys apagadas");
  }
}
function status(k){
  if(k.revogada)return "REVOGADA";
  if(k.expira && Date.now()>=k.expira)return "EXPIRADA";
  return "ATIVA";
}
function render(){
  const arr=keys();
  let at=0,rv=0;
  arr.forEach(k=>{if(status(k)==="ATIVA")at++;if(k.revogada)rv++});
  document.getElementById("total").textContent=arr.length;
  document.getElementById("ativas").textContent=at;
  document.getElementById("revogadas").textContent=rv;
  const lista=document.getElementById("lista");
  if(!arr.length){lista.innerHTML='<div class="empty">Nenhuma key criada.</div>';return}
  lista.innerHTML=arr.map((k,i)=>{
    const st=status(k);
    const validade=k.expira?new Date(k.expira).toLocaleDateString("pt-BR"):"Ilimitada";
    return `<div class="row">
      <div class="key">${k.key}</div>
      <div class="meta">Validade: ${validade} • Status: ${st}</div>
      ${st==="ATIVA"?`<button onclick="revogar(${i})">REVOGAR</button>`:""}
    </div>`;
  }).join("");
}
function toast(t){
  const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");
  setTimeout(()=>x.classList.remove("show"),1800);
}
render();
</script>
</body>
</html>
